<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomato Radio 130.3</title>
<script>
  /* The schedule, mirrored from station.liq. The server is the authority
     (see /show.json) — this copy exists so the palette is right on the very
     first frame, and so the page still names the show when it's hosted with
     no station behind it.

     ⚠ Liquidsoap can't hand its switch to JavaScript. Change station.liq and
     change this too, or the page will confidently name the wrong show. */
  var SHOWS = {
    firstlight:    { label: "first light",    palette: "morning" },
    slowroll:      { label: "slow roll",      palette: "morning" },
    midday:        { label: "midday",         palette: "afternoon" },
    longafternoon: { label: "long afternoon", palette: "afternoon" },
    slowdrive:     { label: "slow drive",     palette: "evening" },
    nightgarage:   { label: "night garage",   palette: "evening" },
    smallhours:    { label: "small hours",    palette: "night" },
    afrofriday:    { label: "afro friday",    palette: "evening" },
    saturdaysoul:  { label: "saturday soul",  palette: "morning" },
    hiphop:        { label: "hip hop hours",  palette: "afternoon" },
    trap:          { label: "trap",           palette: "evening" },
    househours:    { label: "house hours",    palette: "night" },
    sundayfolk:    { label: "sunday folk",    palette: "morning" },
    country:       { label: "country",        palette: "afternoon" },
    sundaynight:   { label: "sunday night",   palette: "night" }
  };

  function currentShow(when) {
    var d = when || new Date(), h = d.getHours();
    var w = d.getDay() === 0 ? 7 : d.getDay();      // 1 = Monday … 7 = Sunday
    if (w === 5 && h >= 17) return "afrofriday";
    if (w === 6) {
      if (h < 6)  return "afrofriday";              // Friday night, past midnight
      if (h < 12) return "saturdaysoul";
      if (h < 18) return "hiphop";
      if (h < 22) return "trap";
      return "househours";
    }
    if (w === 7) {
      if (h < 6)  return "househours";              // Saturday night, same idea
      if (h < 14) return "sundayfolk";
      if (h < 22) return "country";
      return "sundaynight";
    }
    if (w === 1 && h < 6) return "sundaynight";     // Sunday night, past midnight
    if (h < 6)  return "smallhours";
    if (h < 10) return "firstlight";
    if (h < 12) return "slowroll";
    if (h < 14) return "midday";
    if (h < 17) return "longafternoon";
    if (h < 20) return "slowdrive";
    if (h < 23) return "nightgarage";
    return "smallhours";
  }

  var earlyManualShow = null;
  try { earlyManualShow = localStorage.getItem("pomato.manualShow") || null; } catch (e) {}
  document.documentElement.dataset.band = SHOWS[earlyManualShow || currentShow()].palette;
</script>
<style>
  :root,
  :root[data-band="afternoon"] {
    --bg:      #140f0c;
    --ink:     #f2e7d9;
    --ink-dim: #8e8175;
    --accent:  #d4714a;
    --line:    #2e261f;
    --glow:    rgba(212,113,74,.22);
  }
  :root[data-band="night"] {
    --bg:      #0c0f15; --ink: #e2e8f0; --ink-dim: #76818f;
    --accent:  #6e93c4; --line: #1e242e; --glow: rgba(110,147,196,.20);
  }
  :root[data-band="morning"] {
    --bg:      #150f09; --ink: #f4e9d6; --ink-dim: #93866f;
    --accent:  #e0a356; --line: #2f2718; --glow: rgba(224,163,86,.22);
  }
  :root[data-band="evening"] {
    --bg:      #150b09; --ink: #f2ded7; --ink-dim: #937871;
    --accent:  #e2523c; --line: #2f1f1b; --glow: rgba(226,82,60,.24);
  }

  :root { --gold: #c9a24a; --gold-hi: #e8cf8e; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  /* One rule, every size: the card centers as a block, both axes, with the
     viewport's slack split evenly above and below it. Phone, tablet, laptop,
     an actual 24" monitor — same alignment throughout, nothing that swaps
     behavior at a breakpoint.

     min-height, not height — body needs to be free to grow past 100dvh when
     the card itself is taller than the viewport (any laptop under about
     820px tall, 1366×768 included). height:100% on body was fighting that:
     it fixed the box at exactly the viewport height, so a taller centered
     card overflowed both above and below it — and the overflow above y=0
     has no scroll position that reaches it, permanently clipping the header
     with no way back to it. min-height alone still guarantees full-viewport
     background coverage on short content; it just also lets the box grow
     when it needs to, which is the part height:100% was preventing. */
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 20px 26px;
    position: relative;
    overflow-x: hidden;
    transition: background-color 2.5s ease, color 2.5s ease;
  }


  /* Warm light spilling in from the top-left, as in the mockup. */
  .glow {
    position: fixed; inset: -40% -20% auto -30%; height: 90%;
    background: radial-gradient(42% 52% at 18% 12%, var(--glow), transparent 72%);
    filter: blur(30px); pointer-events: none;
    transition: background 2.5s ease;
  }
  .grain {
    position: fixed; inset: -100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.4'/></svg>");
    opacity: .13; mix-blend-mode: overlay; pointer-events: none;
    animation: shift 700ms steps(3) infinite;
  }
  @keyframes shift {
    0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)}
    66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)}
  }

  /* header, .nav-menu and main are three sibling flex children of body
     (the dropdown sits between the header and whichever panel is active,
     rather than everything nesting inside one <main>) — each needs the
     same width cap independently so they still read as one aligned column
     instead of each finding its own natural width. */
  header, .nav-menu, main { width: min(100%, 430px); }
  main { position: relative; display: flex; flex-direction: column; }

  /* ------------------------------------------------------------- header */
  header { display: flex; align-items: center; gap: 12px; }

  .icon-btn {
    width: 40px; height: 40px; flex: none;
    border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .icon-btn:hover { border-color: var(--accent); background: rgba(255,255,255,.06); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; }

  /* min-width:0 lets the middle column actually shrink — without it the
     nowrap wordmark sets a floor and pushes the frequency pill off-screen. */
  .brand { flex: 1; min-width: 0; text-align: center; }
  .bars { display: flex; gap: 2.5px; justify-content: center; align-items: flex-end; height: 13px; margin-bottom: 6px; }
  .bars i { width: 2px; background: var(--accent); border-radius: 1px; opacity: .85; height: 7px; }
  body.playing .bars i { animation: bounce 900ms ease-in-out infinite; }
  .bars i:nth-child(1){animation-delay:0ms}   .bars i:nth-child(2){animation-delay:120ms}
  .bars i:nth-child(3){animation-delay:240ms} .bars i:nth-child(4){animation-delay:80ms}
  .bars i:nth-child(5){animation-delay:300ms} .bars i:nth-child(6){animation-delay:180ms}
  .bars i:nth-child(7){animation-delay:60ms}
  @keyframes bounce { 0%,100%{height:3px} 50%{height:12px} }

  .wordmark-sm {
    font-family: Georgia, serif; font-size: 15px; letter-spacing: .3em;
    text-transform: uppercase; white-space: nowrap;
  }
  .wordmark-sm em { font-style: normal; color: var(--accent); }
  .tagline {
    margin-top: 4px; font-size: 8.5px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--ink-dim);
  }

  .freq-pill {
    display: flex; align-items: center; gap: 7px; flex: none;
    padding: 8px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03);
    font-size: 12px; letter-spacing: .04em; white-space: nowrap;
  }
  .freq-pill svg { width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 1.6; }

  /* --------------------------------------------------------------- disc */

  /* Two speeds set per show in JS: --spin for the record, --pulse for the
     label's breathing. Small Hours turns slowly and breathes deeply; House
     Hours turns fast and breathes quick. Same artwork, different character. */
  .deck {
    width: min(74vw, 300px); aspect-ratio: 1; margin: 26px auto 0; position: relative;
    --spin: 7s; --pulse: 6s; --lift: 0px;
    transition: transform .5s cubic-bezier(.2,.7,.3,1);
    transform: translate3d(var(--px, 0px), var(--py, 0px), 0);
    will-change: transform;
  }
  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        #0d0b0a 0 2px, #17130f 2px 3.4px),
      #0d0b0a;
    box-shadow:
      inset 0 0 0 2px var(--gold),
      inset 0 0 22px rgba(0,0,0,.9),
      0 26px 60px rgba(0,0,0,.65);
    animation: spin var(--spin) linear infinite;
    animation-play-state: paused;
    opacity: .82; transition: opacity .5s ease;
  }
  body.playing .vinyl { animation-play-state: running; opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .label {
    position: absolute; inset: 27%; border-radius: 50%;
    background: var(--label-img, url("label.png")) center / cover no-repeat, #1b1a1c;
    box-shadow: 0 0 0 3px var(--gold), 0 0 0 4px rgba(0,0,0,.55);
    /* The label sits still while the grooves turn around it — a spinning
       video would be unwatchable. Scale is the only motion here, so it reads
       as a breath rather than a wobble. */
    animation: breathe var(--pulse) ease-in-out infinite;
    animation-play-state: paused;
    transition: background-image .6s ease;
  }
  body.playing .label { animation-play-state: running; }
  @keyframes breathe {
    50% { transform: scale(1.035); }
  }

  /* The gold rim brightens on the same clock as the breath, so the disc reads
     as one object rather than a label pulsing inside a static ring. */
  .halo {
    position: absolute; inset: -6px; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 1px rgba(214,175,106,.22), 0 0 34px rgba(214,175,106,.10);
    opacity: 0; transition: opacity .6s ease;
    animation: halo var(--pulse) ease-in-out infinite;
    animation-play-state: paused;
  }
  body.playing .halo { opacity: 1; animation-play-state: running; }
  @keyframes halo {
    50% { box-shadow: 0 0 0 1px rgba(214,175,106,.42), 0 0 52px rgba(214,175,106,.24); }
  }
  /* The loop sits on top of label.png, which stays as the poster and the
     fallback — if the video is slow to load, or a browser refuses to autoplay
     it, the still is already there and nothing flashes empty. */
  .label-vid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 50%;
    display: block;
  }

  .label::after {
    content: ""; position: absolute; left: 50%; top: 50%; z-index: 2;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: #0a0908;
    box-shadow: 0 0 0 2px rgba(0,0,0,.5);
  }

  .play-hit {
    position: absolute; inset: 0; border: 0; background: none;
    border-radius: 50%; cursor: pointer;
  }
  .play-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }

  /* ------------------------------------------------------------ readout */
  .onair {
    margin: 22px auto 0; display: flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--ink-dim); transition: border-color .4s ease, color .4s ease;
  }
  body.playing .onair { border-color: var(--accent); color: var(--ink); }
  .onair i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); }
  body.playing .onair i { background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  body.offline .onair i { background: #7a3b3b; }
  @keyframes pulse { 50% { opacity: .3; } }

  .wordmark {
    margin-top: 16px; text-align: center;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: clamp(30px, 9vw, 42px); font-weight: 400; line-height: 1.05;
  }
  .wordmark em { font-style: italic; color: var(--accent); }

  .track {
    margin-top: 10px; text-align: center;
    font-family: Georgia, serif; font-size: clamp(15px, 4.4vw, 19px);
    min-height: 24px;
  }
  .show-line {
    margin-top: 6px; text-align: center; font-size: 10px;
    letter-spacing: .26em; text-transform: uppercase; color: var(--ink-dim);
    min-height: 14px;
  }
  .upnext {
    margin-top: 4px; text-align: center; font-size: 9.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
    opacity: .65; min-height: 12px;
  }

  .pick-pill {
    margin: 8px auto 0; display: block; padding: 6px 14px;
    border-radius: 999px; border: 1px solid var(--accent);
    background: rgba(255,255,255,.03); color: var(--accent);
    font: inherit; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    cursor: pointer; transition: background .2s ease;
  }
  .pick-pill:hover { background: rgba(255,255,255,.08); }

  /* ---------------------------------------------------------- transport */
  .transport {
    margin-top: 22px; display: flex; align-items: center;
    justify-content: center; gap: 22px;
  }
  .play-btn {
    width: 66px; height: 66px; border-radius: 50%;
    border: 1px solid var(--accent);
    background: rgba(255,255,255,.03); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 22px -6px var(--accent);
    transition: transform .18s ease, box-shadow .25s ease;
  }
  .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px -4px var(--accent); }
  .play-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .play-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .pause-icon { display: none; }
  body.playing .play-icon { display: none; }
  body.playing .pause-icon { display: block; }

  /* ------------------------------------------------------------- volume */
  .vol { margin-top: 22px; display: flex; align-items: center; gap: 12px; color: var(--ink-dim); }
  .vol svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  .vol input {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 3px; border-radius: 3px; cursor: pointer;
    background: linear-gradient(to right, var(--accent) var(--pct,80%), var(--line) var(--pct,80%));
  }
  .vol input::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(0,0,0,.35);
  }
  .vol input::-moz-range-thumb {
    width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--accent);
  }

  /* --------------------------------------------------------------- dial */
  .dial { margin-top: 26px; }
  /* space-between with fixed-width marks, not flex:1 — forty-one flexed
     children each take a seventeen-pixel share and read as blocks, not ticks. */
  .ticks { display: flex; justify-content: space-between; align-items: flex-end; height: 22px; }
  .ticks i { width: 1.5px; flex: none; background: var(--line); height: 6px; border-radius: 1px; }
  .ticks i.major { height: 13px; background: var(--ink-dim); opacity: .5; }
  .ticks i.here { height: 22px; width: 2px; background: var(--accent); }
  .scale {
    display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 9.5px; letter-spacing: .1em; color: var(--ink-dim);
  }
  .needle {
    margin-top: 2px; text-align: center; font-size: 12px;
    letter-spacing: .1em; color: var(--accent);
  }

  /* ------------------------------------------------------------- footer */
  footer { margin-top: 26px; padding-top: 22px; display: flex; justify-content: center; }
  .stats {
    display: flex; align-items: center; gap: 0;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.02); overflow: hidden;
  }
  .stats span {
    padding: 9px 17px; font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-dim);
    display: flex; align-items: center; gap: 7px;
  }
  .stats span + span { border-left: 1px solid var(--line); }
  .stats b { color: var(--ink); font-weight: 400; }
  .stats svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; }

  /* ------------------------------------------------------------ schedule */
  /* --------------------------------------------------------------- menu
     Three sibling views (Live / Weekday / Weekend). A permanent tab bar
     was the first version of this; a hamburger opening a short dropdown
     of subsections reads more like an actual menu and stops competing
     with the player for space when you're not switching. Slides open
     rather than just appearing — max-height is the one property that
     animates cleanly on a from-height-0 element without knowing its
     content height up front. */
  .nav-menu {
    width: 100%; overflow: hidden; max-height: 0;
    transition: max-height .25s ease;
  }
  .nav-menu.open { max-height: 220px; }
  .nav-item {
    display: block; width: 100%; padding: 12px 14px; margin-top: 6px;
    border-radius: 8px; border: 1px solid var(--line);
    background: rgba(255,255,255,.02); color: var(--ink);
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .nav-item:hover { border-color: var(--accent); }
  .nav-item.active { color: var(--accent); border-color: var(--accent); }

  .panel { width: 100%; }
  /* :not([hidden]) rather than a bare selector — an ID selector's
     display:flex otherwise outranks the browser's default [hidden]{display:
     none} rule, so the hidden attribute would stop actually hiding
     anything and every panel would show at once. */
  #panel-live:not([hidden]) { display: flex; flex-direction: column; flex: 1; }
  #panel-weekday, #panel-weekend { padding-top: 18px; }
  .panel h2 {
    font-family: Georgia, serif; font-size: 19px; font-weight: 400;
    margin-bottom: 3px;
  }
  .panel p.sub { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 16px; }

  .auto-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 4px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,.02);
    color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .auto-row:hover { border-color: var(--accent); }
  .auto-row .check { font-style: normal; color: var(--accent); opacity: 0; }
  .auto-row.active .check { opacity: 1; }
  .pick-hint {
    font-size: 10.5px; color: var(--ink-dim); opacity: .75;
    margin-bottom: 14px; line-height: 1.4;
  }

  /* A plain <button> carries the browser's own default border on every
     side — only border-bottom was ever meant to show, but nothing had
     reset the other three, which is what made every row look like a
     boxed pill instead of a clean list line. */
  .slot {
    display: flex; gap: 12px; padding: 10px 4px; font-size: 12.5px;
    border: none; border-bottom: 1px solid var(--line);
    width: 100%; background: none; color: inherit; font-family: inherit;
    text-align: left; cursor: pointer; transition: background .15s ease;
  }
  .slot:hover { background: rgba(255,255,255,.04); }
  .slot:last-child { border-bottom: 0; }
  /* Wide enough for the longest weekend label ("Sat 22:00 – Sun 06:00") on one
     line — wrapping the times makes the column unreadable. */
  .slot time { color: var(--ink-dim); flex: none; width: 146px; font-size: 10.5px; letter-spacing: .02em; white-space: nowrap; }
  .slot.now { color: var(--accent); }
  .slot.now time { color: var(--accent); }

  /* Narrow phones. The header is three rigid columns at full size; below this
     the wordmark's letter-spacing alone is wider than the space left over, so
     everything tightens and the pill drops its "FM". */
  @media (max-width: 430px) {
    body { padding: 14px 14px 20px; }
    .icon-btn { width: 36px; height: 36px; }
    header { gap: 8px; }
    .wordmark-sm { font-size: 12px; letter-spacing: .16em; }
    .tagline { font-size: 7.5px; letter-spacing: .2em; }
    .freq-pill { padding: 7px 10px; font-size: 11px; gap: 5px; }
    .freq-pill svg { width: 12px; height: 12px; }
    .transport { gap: 16px; }
    .slot time { width: 122px; font-size: 9.5px; }
  }

  /* Very narrow. Drop the tagline rather than let it wrap under the wordmark. */
  @media (max-width: 360px) {
    .tagline { display: none; }
    .wordmark-sm { font-size: 11px; letter-spacing: .1em; }
    .freq-pill .fm { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .grain, .vinyl, .bars i, .label, .halo { animation: none; }
    .deck { transform: none; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="grain"></div>

<header>
  <button class="icon-btn" id="menu" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="wordmark-sm">Pomato <em>Radio</em></div>
    <div class="tagline">tune in · feel good</div>
  </div>
  <div class="freq-pill">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M7.5 7.5a6.4 6.4 0 000 9M16.5 16.5a6.4 6.4 0 000-9"/></svg>
    130.3<span class="fm">&nbsp;FM</span>
  </div>
</header>

<!-- Three separate views instead of one page carrying the player, the
     weekday dayparts and the weekend genres all at once — that was the
     "too much information" complaint. A persistent tab bar was the first
     attempt at switching between them; the hamburger + dropdown is closer
     to what a radio app menu actually looks like, and reads as "here are
     subsections" rather than three permanent buttons competing with the
     player for space. Picking a show in either schedule panel jumps back
     to Live so the choice is immediately visible and audible. -->
<nav class="nav-menu" id="navMenu" hidden>

  <button class="nav-item" data-panel="weekday">Weekday Music</button>

<!-- No crossorigin attribute: it forces a CORS check against Icecast, which
     sends no Access-Control-Allow-Origin, and playback dies with
     NotSupportedError. Plain media playback is exempt from CORS. -->
<audio id="audio" preload="none"></audio>
<!-- Second deck, used only by the preview rotation's crossfade — the live
     stream is a single continuous feed and never needs one. -->
<audio id="audioB" preload="none"></audio>
<!-- Third deck: the host, riding over the music the same way drops ride
     over the mix on the real station (station.liq's smooth_add). -->
<audio id="dropDeck" preload="none"></audio>

<script>
/* Point this at a public Icecast mount to put the page anywhere. Left on
   localhost it works when you run the station yourself; hosted on GitHub
   Pages with no server behind it, the page still renders the right show and
   schedule from the fallback below — it simply reports Off air, which is the
   truth, rather than pretending. */
const STREAM = "http://localhost:8000/radio.mp3";
const MOUNT  = "radio.mp3";

const audio = document.getElementById("audio");
const audioB = document.getElementById("audioB");
const dropDeck = document.getElementById("dropDeck");
const decks = [audio, audioB];
const stateEl = document.getElementById("state");
const volEl = document.getElementById("vol");

/* ------------------------------------------------------------- playback */
let failed = false;
let masterVol = 0.8;
let deckIdx = 0;                 // which deck[] is the audible "current" track
let crossfading = false;
let fadeT = 0;                   // 0..1 progress of an in-flight crossfade

// Matches station.liq's smooth_add(p=0.35, ...) — the music bed drops to
// this fraction of its volume while a voice drop rides over it, the same
// ratio the real station ducks by.
const DUCK = 0.35;
let ducked = false;

/* A straight linear ramp put the incoming track at 50% volume by the
   crossfade's midpoint — loud enough to fully clash with whatever's still
   finishing, which is what read as the two tracks fighting rather than one
   handing off to the other. The incoming track now stays noticeably
   quieter through most of the fade and only rises to full in the final
   stretch, once the outgoing track has mostly cleared out — fades in low,
   then properly begins, rather than the two meeting head-on in the middle. */
function fadeInCurve(t) {
  const HOLD = 0.6, HOLD_VOL = 0.3;
  if (t < HOLD) return (t / HOLD) * HOLD_VOL;
  return HOLD_VOL + ((t - HOLD) / (1 - HOLD)) * (1 - HOLD_VOL);
}

/* Volume applies to whichever deck the listener can actually hear right
   now — just the front deck normally, both of them mid-crossfade, each
   scaled by how far into the fade it is, and all of it pulled down to DUCK
   while a drop is playing over the top. */
function applyVolume() {
  const duckMul = ducked ? DUCK : 1;
  decks.forEach((d, i) => {
    const frac = i === deckIdx ? (1 - fadeT) : fadeInCurve(fadeT);
    d.volume = masterVol * duckMul * frac;
  });
  dropDeck.volume = masterVol;
}
function setVol(v) {
  masterVol = v;
  applyVolume();
  volEl.value = v;
  volEl.style.setProperty("--pct", (v * 100) + "%");
  try { localStorage.setItem("pomato.volume", v); } catch {}
}
setVol(parseFloat(localStorage.getItem("pomato.volume") ?? "0.8"));
volEl.addEventListener("input", () => setVol(+volEl.value));

let lastVol = masterVol;
document.getElementById("mute").addEventListener("click", () => {
  if (masterVol > 0) { lastVol = masterVol; setVol(0); }
  else setVol(lastVol || 0.8);
});

/* A live stream has to be re-fetched on every play, or the browser resumes
   from a stale buffer and you hear audio from minutes ago. */
function start() {
  failed = false;
  audio.src = STREAM + "?t=" + Date.now();
  audio.play().then(() => setPlaying(true)).catch(() => startPreview());
}
function stop() {
  preview = false;
  crossfading = false;
  decks.forEach((d, i) => { clearCrossfadeTimer(i); d.pause(); d.removeAttribute("src"); d.load(); });
  clearTimeout(dropTimer);
  dropTimer = null;
  ducked = false;
  dropDeck.pause();
  dropDeck.removeAttribute("src");
  dropDeck.load();
  setPlaying(false);
}
function toggle() { document.body.classList.contains("playing") ? stop() : start(); }

document.getElementById("play").addEventListener("click", toggle);
document.getElementById("discBtn").addEventListener("click", toggle);

/* Live has "jump to live"; preview has nothing to resync to, so it just
   crossfades on to a different track early — same button, the nearest
   honest meaning in each mode. */
document.getElementById("resync").addEventListener("click", () => {
  if (!document.body.classList.contains("playing")) return;
  if (preview) beginCrossfade();
  else { stop(); start(); }
});

/* ---------------------------------------------------------- fallback mix
   No live stream reaches this page on GitHub Pages, and the audience never
   sees a track picker to work around that — real radio doesn't have one.
   Press play and something is already going, the way turning on a radio
   works: joined mid-track, one title at a time, the next one crossfaded in
   before this one ends rather than cutting to silence. Tracks run in tempo
   order — a beatless ambient piece never lands next to something at 140
   bpm — instead of pure shuffle. web/samples/manifest.json (written by
   scripts/import_trial_music.py, bpm added by aubio) is the pool; whichever
   show the schedule says is on decides which slice of it plays. */
const CROSSFADE = 5;           // seconds of overlap
let preview = false;
let liveShow = null;
let previewManifest = null;
let previewQueue = [];
let previewShow = null;

async function loadPreviewManifest() {
  if (previewManifest) return previewManifest;
  try { previewManifest = await (await fetch("samples/manifest.json?t=" + Date.now())).json(); }
  catch { previewManifest = []; }
  return previewManifest;
}

/* Ascending by bpm, entered at a random point and wrapped — so a return
   visitor doesn't always hear the set open on the same track — rather than
   shuffled outright. The one seam is the wrap from fastest back to slowest;
   everywhere else, consecutive tracks are the closest tempo match available
   in a pool this small. */
function tempoOrder(pool) {
  const sorted = pool.slice().sort((a, b) => (a.bpm || 0) - (b.bpm || 0));
  const at = Math.floor(Math.random() * sorted.length);
  return sorted.slice(at).concat(sorted.slice(0, at));
}

/* Pooling everything by tempo (the previous state of this flag) fixed
   sparse-show isolation but broke something worse: bpm has no idea what
   genre a track is, so a hip hop track, a lo-fi instrumental and an R&B
   ballad landed back to back just because their tempos were close — which
   is what "playing in the order I gave you" actually was: not a sort bug,
   tempo standing in for a genre signal it can't provide. Reuben's since
   placed every track by ear (scripts/reassign_shows.py), so genre now
   means something real here — partitioning by show first, tempo only as
   the tiebreaker within it, is the right call again. Some shows are still
   thin or empty and fall back to the full catalog either way. */
const PARTITION_BY_SHOW = true;

/* Which show picks the pool is read off effectiveShow() — currentShow()
   (the visitor's own clock, same function the header uses to guess the
   palette before anything has loaded) unless they've picked a show of
   their own, in which case that wins — rather than waiting on liveShow,
   which comes from an async fetch that may not have resolved yet if
   someone hits play fast. Every listener hears the show that fits their
   own local time, or their own choice, same as the header already
   promised. */
function buildPreviewQueue(manifest) {
  previewShow = effectiveShow();
  const pool = PARTITION_BY_SHOW ? manifest.filter(t => t.show === previewShow) : manifest;
  return tempoOrder(pool.length ? pool : manifest);
}

/* Re-checked on every track change, not just at the start — a session that
   runs long enough to cross a show boundary drifts into the new show's pool
   the same way the real station would (unless a manual pick is active, in
   which case there's nothing to drift to). Returns the track that should
   play next; previewQueue[0] is always "what's currently audible". */
function pickNextTrack() {
  if (effectiveShow() !== previewShow) previewQueue = buildPreviewQueue(previewManifest);
  else previewQueue.push(previewQueue.shift());
  return previewQueue[0];
}

async function startPreview() {
  const manifest = await loadPreviewManifest();
  if (!manifest.length) { fail("Can't connect"); return; }

  previewQueue = buildPreviewQueue(manifest);
  preview = true;
  deckIdx = 0;
  playFirstPreviewTrack();
  scheduleStartDrop();
}

function updateNowPlaying(track) {
  document.getElementById("now").textContent = track.title;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: "Pomato Radio 130.3",
      artwork: [{ src: location.origin + "/label.png", sizes: "560x560", type: "image/png" }],
    });
  }
}

/* Schedules the crossfade off a setTimeout, computed once from the actual
   playback position rather than polled via timeupdate. It used to be the
   other way round — checking currentTime on every timeupdate tick felt more
   "live" — but timeupdate throttles hard in a backgrounded or unfocused
   tab (measured directly: a track that plays for 8+ real seconds fired it
   twice, both readings identical, then nothing until the track's natural
   end). A radio tab spends most of its life backgrounded — that's the whole
   point of a radio — so a trigger that only works while the tab is in the
   foreground was really only working sometimes, which matches "it works for
   some" exactly. setTimeout keeps firing regardless.

   crossfadeTimers tracks the live timer per deck index so a manual skip
   (resync, mid-track) can cancel the old one — decks are two long-lived
   elements taking turns as "front", and without this a deck that's skipped
   before its timer ever fires keeps counting down in the background and
   fires a stray crossfade later, on top of whatever's playing by then. */
const crossfadeTimers = [null, null];
function clearCrossfadeTimer(idx) {
  if (crossfadeTimers[idx]) clearTimeout(crossfadeTimers[idx]);
  crossfadeTimers[idx] = null;
}
function scheduleCrossfade(deck) {
  const idx = decks.indexOf(deck);
  clearCrossfadeTimer(idx);
  const remaining = (deck.duration || 0) - deck.currentTime;
  const delay = Math.max(0, (remaining - CROSSFADE) * 1000);
  crossfadeTimers[idx] = setTimeout(() => {
    crossfadeTimers[idx] = null;
    if (!crossfading) beginCrossfade();
  }, delay);
}

/* Backstop for the timer landing late anyway — a clamped background tab, a
   duration that read wrong, anything. Without this the alternative on a
   missed schedule is dead air: the track just stops and nothing is
   listening for it to. A late crossfade beats a silent one. */
function armEndedBackstop(deck) {
  deck.addEventListener("ended", () => {
    if (preview && decks[deckIdx] === deck && !crossfading) beginCrossfade();
  });
}
armEndedBackstop(audio);
armEndedBackstop(audioB);

/* --------------------------------------------------------------- drops
   The real station picks a drop at random and ducks the music under it
   (station.liq's smooth_add); this fallback does the same, on its own
   timer since there's no Liquidsoap here to drive it. The interval used to
   cycle a fixed 30/45/60 sequence, repeating — still a pattern a listener
   could learn given enough time. Each wait is now picked fresh and
   independently within the same overall range, so there's no rhythm to it
   at all: could be 32 minutes, then 58, then 21. */
const DROP_MIN_MINUTES = 30;
const DROP_MAX_MINUTES = 60;
const START_DROP_FILE = "drop-the-start.mp3";
let dropTimer = null;
let dropsManifest = null;
let lastDropFile = null;

async function loadDropsManifest() {
  if (dropsManifest) return dropsManifest;
  try { dropsManifest = await (await fetch("samples/drops-manifest.json?t=" + Date.now())).json(); }
  catch { dropsManifest = []; }
  return dropsManifest;
}

/* New listener greeting: "the start" plays once, sometime in the first 5
   minutes rather than at a fixed instant — real enough that it doesn't feel
   like it's firing on a stopwatch — then the regular 30/45/60 cycle takes
   over. It's back in the regular rotation pool too (Reuben wants every
   drop reachable just by listening, not only the greeting once per
   session) — so it can still turn up again later, same odds as the rest. */
function scheduleStartDrop() {
  clearTimeout(dropTimer);
  const delay = (30 + Math.random() * (5 * 60 - 30)) * 1000;   // 30s .. 5min
  dropTimer = setTimeout(() => playDrop(START_DROP_FILE), delay);
}

function scheduleDrop() {
  clearTimeout(dropTimer);
  const mins = DROP_MIN_MINUTES + Math.random() * (DROP_MAX_MINUTES - DROP_MIN_MINUTES);
  dropTimer = setTimeout(() => playDrop(), mins * 60 * 1000);
}

async function playDrop(forceFile) {
  if (!preview) return;                  // stopped since this was scheduled
  let file = forceFile;
  if (!file) {
    const list = await loadDropsManifest();
    if (!list.length) { scheduleDrop(); return; }
    let pick;
    do { pick = list[Math.floor(Math.random() * list.length)]; }
    while (list.length > 1 && pick.file === lastDropFile);
    lastDropFile = pick.file;
    file = pick.file;
  }

  ducked = true;
  applyVolume();
  dropDeck.src = "samples/" + file;
  dropDeck.currentTime = 0;
  dropDeck.volume = masterVol;
  dropDeck.load();
  dropDeck.play().catch(() => { ducked = false; applyVolume(); scheduleDrop(); });
}

dropDeck.addEventListener("ended", () => {
  ducked = false;
  applyVolume();
  scheduleDrop();
});

function playFirstPreviewTrack() {
  const track = previewQueue[0];
  const deck = decks[deckIdx];
  switchingTrack = true;
  deck.src = "samples/" + track.file;
  deck.addEventListener("loadedmetadata", function begin() {
    deck.removeEventListener("loadedmetadata", begin);
    if (track.duration > 6) deck.currentTime = Math.random() * (track.duration - 4);
    applyVolume();
    deck.play().then(() => {
      switchingTrack = false;
      setPlaying(true);
      scheduleCrossfade(deck);
    }).catch(() => { switchingTrack = false; fail("Can't connect"); });
  });
  deck.load();
  updateNowPlaying(track);
}

function beginCrossfade() {
  if (!preview || crossfading || previewQueue.length < 2) return;
  const outDeck = decks[deckIdx];
  const inIdx = 1 - deckIdx;
  const inDeck = decks[inIdx];
  const track = pickNextTrack();

  clearCrossfadeTimer(deckIdx);
  crossfading = true;
  fadeT = 0;
  inDeck.src = "samples/" + track.file;
  inDeck.currentTime = 0;
  inDeck.volume = 0;
  inDeck.load();
  inDeck.play().catch(() => {});
  updateNowPlaying(track);

  // setInterval, not requestAnimationFrame — rAF is tied to compositing and
  // a backgrounded tab stops receiving frames at all, which was the second
  // half of this bug: the trigger fired on schedule but the fade itself then
  // sat frozen at fadeT=0 forever, one deck stuck silent and the other stuck
  // at full volume, because nothing was ever calling step() again. A
  // backgrounded tab still throttles setInterval, just to a coarse ~1s
  // floor rather than pausing outright — a choppier fade beats a stuck one.
  const start = performance.now(), ms = CROSSFADE * 1000;
  const timer = setInterval(step, 100);
  function step() {
    if (!crossfading) { clearInterval(timer); return; }   // stop() cut in mid-fade
    fadeT = Math.min(1, (performance.now() - start) / ms);
    applyVolume();
    if (fadeT < 1) return;
    clearInterval(timer);

    deckIdx = inIdx;                           // flip before pausing outDeck,
    crossfading = false; fadeT = 0;            // so its pause event is ignored
    outDeck.pause();
    outDeck.removeAttribute("src");
    outDeck.load();
    scheduleCrossfade(inDeck);
  }
}

/* Someone who asked the OS for less motion gets the still, not a loop.
   Declared before setPlaying, which reads it — a const referenced from a
   hoisted function still throws if the function runs before this line. */
const stillsOnly = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setPlaying(on) {
  failed = false;
  document.body.classList.toggle("playing", on);
  document.body.classList.remove("offline");
  stateEl.textContent = on ? (preview ? "Previewing" : "On air") : "Off air";
  const label = on ? "Pause the stream" : "Play the stream";
  document.getElementById("play").setAttribute("aria-label", label);
  document.getElementById("discBtn").setAttribute("aria-label", label);

  /* The mascots move only while the station is on air — a dancing label above
     a stopped record reads as broken, and it saves decoding a video nobody is
     listening to. Autoplay is safe here: the clip is muted. */
  const vid = document.getElementById("labelVid");
  if (!vid) return;
  if (on && !stillsOnly) vid.play().catch(() => {});   // poster stays if refused
  else vid.pause();
}
function fail(msg) {
  failed = true;
  preview = false;
  crossfading = false;
  document.body.classList.remove("playing");
  document.body.classList.add("offline");
  stateEl.textContent = msg;
}

/* A rejected play() also fires `pause`; without the flag that handler wipes
   the error message and the user is told nothing at all. Loading a fresh
   track fires it too — .load() pauses before the new source is ready.
   Each deck only drives the shared state while it's the front deck
   (decks[deckIdx]) — during a crossfade the outgoing deck gets paused
   deliberately once deckIdx has already flipped past it, so that pause is
   silently ignored rather than read as the station stopping. */
let switchingTrack = false;
function wireDeck(deck) {
  const isFront = () => decks[deckIdx] === deck;
  deck.addEventListener("pause",   () => { if (isFront() && !failed && !switchingTrack) setPlaying(false); });
  deck.addEventListener("playing", () => { if (isFront()) setPlaying(true); });
  deck.addEventListener("error",   () => { if (isFront() && deck.getAttribute("src")) fail("Stream dropped"); });
}
wireDeck(audio);
wireDeck(audioB);

/* ------------------------------------------------------------- the dial */
(function ticks() {
  const el = document.getElementById("ticks");
  for (let i = 0; i <= 40; i++) {
    const t = document.createElement("i");
    if (i % 10 === 0) t.className = "major";
    if (i === 23) t.className = "here";           // 130.3 across 128–132
    el.appendChild(t);
  }
})();

/* ------------------------------------------------------------- schedule */
const WEEKDAY = [
  ["firstlight", "06:00 – 10:00", "first light"], ["slowroll", "10:00 – 12:00", "slow roll"],
  ["midday", "12:00 – 14:00", "midday"], ["longafternoon", "14:00 – 17:00", "long afternoon"],
  ["slowdrive", "17:00 – 20:00", "slow drive"], ["nightgarage", "20:00 – 23:00", "night garage"],
  ["smallhours", "23:00 – 06:00", "small hours"],
];
const WEEKEND = [
  ["afrofriday", "Fri 17:00 – Sat 06:00", "afro friday"], ["saturdaysoul", "Sat 06:00 – 12:00", "saturday soul"],
  ["hiphop", "Sat 12:00 – 18:00", "hip hop hours"], ["trap", "Sat 18:00 – 22:00", "trap"],
  ["househours", "Sat 22:00 – Sun 06:00", "house hours"], ["sundayfolk", "Sun 06:00 – 14:00", "sunday folk"],
  ["country", "Sun 14:00 – 22:00", "country"], ["sundaynight", "Sun 22:00 – Mon 06:00", "sunday night"],
];

function renderList(el, list, activeKey) {
  el.innerHTML = list.map(([key, when, name]) =>
    `<button class="slot${key === activeKey ? " now" : ""}" data-show="${key}">` +
    `<time>${when}</time><span>${name}</span></button>`).join("");
}

function renderSchedule(activeKey, isPick) {
  renderList(document.getElementById("schedWeekday"), WEEKDAY, activeKey);
  renderList(document.getElementById("schedWeekend"), WEEKEND, activeKey);
  document.getElementById("autoToggleWeekday").classList.toggle("active", !isPick);
  document.getElementById("autoToggleWeekend").classList.toggle("active", !isPick);
}

/* --------------------------------------------------------- listen-your-way
   Every listener otherwise hears whatever the clock says — that's the whole
   point of a schedule. This lets one person tune to a specific show instead,
   without touching what anyone else hears: it only ever changes the local
   fallback rotation this browser is drawing from, never the shared stream
   (which has no concept of "just for me" — it's one broadcast). Persisted
   in localStorage so the choice survives a reload, same as volume. */
let manualShow = null;
try { manualShow = localStorage.getItem("pomato.manualShow") || null; } catch {}

function effectiveShow(when) {
  return manualShow || currentShow(when);
}

function chooseShow(key) {
  manualShow = key === "auto" ? null : key;
  try {
    if (manualShow) localStorage.setItem("pomato.manualShow", manualShow);
    else localStorage.removeItem("pomato.manualShow");
  } catch {}
  showNow();
  switchPanel("live");   // see it (and hear it) take effect immediately
  // Jump to the new pick right away rather than waiting for the track
  // already playing to end on its own schedule.
  if (preview && document.body.classList.contains("playing") && !crossfading) {
    beginCrossfade();
  }
}

document.getElementById("schedWeekday").addEventListener("click", e => {
  const row = e.target.closest(".slot");
  if (row) chooseShow(row.dataset.show);
});
document.getElementById("schedWeekend").addEventListener("click", e => {
  const row = e.target.closest(".slot");
  if (row) chooseShow(row.dataset.show);
});
document.getElementById("autoToggleWeekday").addEventListener("click", () => chooseShow("auto"));
document.getElementById("autoToggleWeekend").addEventListener("click", () => chooseShow("auto"));
document.getElementById("pickPill").addEventListener("click", () => chooseShow("auto"));

/* ---------------------------------------------------------------- menu */
const navMenu = document.getElementById("navMenu");
const menuBtn = document.getElementById("menu");

function closeMenu() {
  navMenu.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
  // hidden waits for the slide-up transition (250ms) to actually finish —
  // setting it immediately would cut the closing animation off mid-motion,
  // since display:none can't be transitioned. Guarded in case the menu got
  // reopened again before this fires.
  setTimeout(() => { if (!navMenu.classList.contains("open")) navMenu.hidden = true; }, 260);
}
function toggleMenu() {
  if (navMenu.classList.contains("open")) { closeMenu(); return; }
  navMenu.hidden = false;
  // hidden has to come off before adding .open, or the max-height
  // transition has nothing to animate from — the browser needs a layout
  // frame where the element is display:block at max-height:0 first.
  requestAnimationFrame(() => navMenu.classList.add("open"));
  menuBtn.setAttribute("aria-expanded", "true");
}
menuBtn.addEventListener("click", toggleMenu);

function switchPanel(name) {
  document.querySelectorAll(".panel").forEach(p => { p.hidden = p.id !== `panel-${name}`; });
  document.querySelectorAll(".nav-item").forEach(t => t.classList.toggle("active", t.dataset.panel === name));
  closeMenu();
}
navMenu.addEventListener("click", e => {
  const btn = e.target.closest(".nav-item");
  if (btn) switchPanel(btn.dataset.panel);
});

/* --------------------------------------------------------------- polling */
let lastTrack = null;

async function poll() {
  if (preview) return;   // the preview rotation owns #now while it's playing
  try {
    const r = await fetch("nowplaying.txt?t=" + Date.now());
    const t = r.ok ? (await r.text()).trim() : "";
    if (t !== lastTrack) {
      lastTrack = t;
      document.getElementById("now").textContent = t || "untitled";
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t || "Pomato Radio 130.3",
          artist: "Pomato Radio 130.3",
          artwork: [{ src: location.origin + "/label.png", sizes: "560x560", type: "image/png" }],
        });
      }
    }
  } catch {}

  try {
    const r = await fetch("status.json?t=" + Date.now());
    if (r.ok) {
      const d = await r.json();
      const src = [].concat(d?.icestats?.source ?? [])
        .find(s => String(s.listenurl || "").includes(MOUNT));
      document.getElementById("listeners").textContent =
        src ? `${src.listeners} listening` : "off air";
    }
  } catch {}
}

/* The show comes from the server, on the station's clock. There is one stream,
   so every listener hears the same hour no matter where they are — working it
   out from the browser clock would name a show that isn't playing. */
/* Standalone fallback, for when the page is hosted with no station behind it
   (GitHub Pages). Same tables, same shape as /show.json — but read off the
   visitor's clock, which is a guess: it names the show that *would* be on if
   the station ran in their timezone. Good enough to show the schedule; the
   server always wins when there is one. */
function localShow() {
  const show = currentShow();
  const now = new Date();
  let probe = new Date(now); probe.setMinutes(0, 0, 0);
  let nxt = show, at = null;
  for (let i = 0; i < 48; i++) {
    probe = new Date(probe.getTime() + 3600e3);
    const c = currentShow(probe);
    if (c !== show) { nxt = c; at = probe; break; }
  }
  const pad = n => String(n).padStart(2, "0");
  return {
    show, label: SHOWS[show].label, palette: SHOWS[show].palette,
    art: "label.png", clip: "label.mp4",
    station_time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    station_offset_minutes: -now.getTimezoneOffset(),
    next: { show: nxt, label: SHOWS[nxt].label,
            at: at ? `${pad(at.getHours())}:00` : null }
  };
}

async function showNow() {
  let s;
  try { s = await (await fetch("show.json?t=" + Date.now())).json(); }
  catch { s = localShow(); }

  liveShow = s.show;

  // A manual pick overrides what's shown/played only while there's actually
  // a choice to honor: off air, or in the local fallback rotation, where
  // this page decides what plays. A genuine live connection is one shared
  // broadcast with no per-listener concept at all — showing a pick that
  // can't actually take effect there would just be lying about what's
  // audible, so it's ignored in that one case. station_time is never
  // touched either way — that's clock information, true regardless of what
  // the visitor chose to listen to. Art/clip fall back to the generic label
  // rather than guessing whether a per-show asset exists for a show the
  // server was never asked about.
  const liveConnected = document.body.classList.contains("playing") && !preview;
  if (manualShow && !liveConnected) {
    s = { ...s, show: manualShow, label: SHOWS[manualShow].label,
          palette: SHOWS[manualShow].palette, art: "label.png", clip: "label.mp4",
          next: { show: null, label: null, at: null } };
  }

  document.documentElement.dataset.band = s.palette;
  document.getElementById("show").textContent = s.label;
  dressDisc(s.show, s.art, s.clip);
  document.getElementById("stationTimeWeekday").textContent = s.station_time;
  document.getElementById("stationTimeWeekend").textContent = s.station_time;

  const applied = manualShow && !liveConnected;
  const pickPill = document.getElementById("pickPill");
  pickPill.hidden = !applied;

  const mine = -new Date().getTimezoneOffset();
  const elsewhere = Math.abs(mine - s.station_offset_minutes) > 1;
  const next = applied ? "" : (s.next.at ? `next: ${s.next.label} at ${s.next.at}` : "");
  document.getElementById("upnext").textContent =
    !applied && elsewhere ? `${next} · station time ${s.station_time}` : next;

  renderSchedule(s.show, applied);
}

/* ------------------------------------------------------------- the disc

   How fast the record turns and how deeply the label breathes are set per
   show. Small Hours turns once every fourteen seconds and breathes slowly;
   House Hours turns in five and breathes in three. One still image, but the
   disc carries a different mood at 3am than it does on Saturday night. */
const ENERGY = {
  smallhours: "calm",  sundayfolk: "calm",     firstlight: "calm",
  sundaynight: "calm",
  slowroll: "steady",  midday: "steady",       longafternoon: "steady",
  slowdrive: "steady", saturdaysoul: "steady", country: "steady",
  nightgarage: "high", afrofriday: "high",     hiphop: "high",
  trap: "high",        househours: "high"
};
const TEMPO = {
  calm:   { spin: "14s", pulse: "9s" },
  steady: { spin: "9s",  pulse: "6s" },
  high:   { spin: "5s",  pulse: "3.2s" }
};

/* Artwork per show. Drop web/label-<show>.png in — a calm standing pose for
   Sunday Folk, a dancing one for House Hours — and the server reports it on
   the next poll. The page never probes for files that might not be there. */
let currentDressed = null;

function dressDisc(show, art, clip) {
  if (show === currentDressed) return;
  currentDressed = show;
  const t = TEMPO[ENERGY[show] || "steady"];
  const deck = document.getElementById("deck");
  deck.style.setProperty("--spin", t.spin);
  deck.style.setProperty("--pulse", t.pulse);

  const still = art || "label.png";
  document.getElementById("label").style.setProperty("--label-img", `url("${still}")`);

  /* Only reload the video when the file actually changes — assigning src
     unconditionally would restart the loop on every poll, five seconds apart. */
  const vid = document.getElementById("labelVid");
  const want = clip || "label.mp4";
  if (vid && !vid.currentSrc.endsWith(want)) {
    vid.poster = still;
    vid.querySelector("source").src = want;
    vid.load();
    if (document.body.classList.contains("playing") && !stillsOnly) {
      vid.play().catch(() => {});
    }
  }
}

/* Pointer parallax. The deck is the parent of the spinning record, so moving
   it shifts the whole disc as one object — doing this to the label instead
   would fight the rotation. Skipped on touch, where there's no hover to track
   and it would only ever be a jump on tap. */
if (matchMedia("(hover: hover) and (pointer: fine)").matches &&
    !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const deck = document.getElementById("deck");
  addEventListener("pointermove", e => {
    const dx = (e.clientX / innerWidth - 0.5) * 2;      // -1 … 1
    const dy = (e.clientY / innerHeight - 0.5) * 2;
    deck.style.setProperty("--px", (dx * 9).toFixed(1) + "px");
    deck.style.setProperty("--py", (dy * 7).toFixed(1) + "px");
  }, { passive: true });
  addEventListener("pointerleave", () => {
    deck.style.setProperty("--px", "0px");
    deck.style.setProperty("--py", "0px");
  });
}

poll(); showNow();
setInterval(poll, 5000);
setInterval(showNow, 30000);

addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); }
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", stop);
}
</script>
</body>
